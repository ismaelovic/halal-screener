version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: halal_screener_api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=${SUPABASE_DB_URL}
      - EODHD_API_KEY=${EODHD_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
